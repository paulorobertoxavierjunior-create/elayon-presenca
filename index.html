<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bancada • Elayon Presença</title>
    <style>
        body { display: none; font-family: system-ui, sans-serif; background: #f0f7f8; margin: 0; color: #0a2a2f; }
        
        .header { background: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #cfe4e7; }
        .logo { font-weight: bold; color: #66c7c0; }
        
        /* Botão de Perfil com ícone sugerido */
        .profile-btn { 
            background: #66c7c0; color: white; border: none; padding: 8px; 
            border-radius: 50%; cursor: pointer; width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
        }

        .container { max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        
        .tool-list { margin-top: 25px; display: flex; flex-direction: column; gap: 12px; }
        .tool-item { 
            background: #7bd490; color: #0a2a2f; padding: 18px; 
            border-radius: 12px; text-align: center; font-weight: 600; 
            text-decoration: none; transition: 0.2s;
        }
        .tool-item:hover { transform: scale(1.02); filter: brightness(1.05); }
    </style>
</head>
<body data-page="presenca">

    <header class="header">
        <div class="logo">ELAYON PRESENÇA</div>
        <button class="profile-btn" id="btnProfile" title="Meu Perfil">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </button>
    </header>

    <main class="container">
        <div class="card">
            <h2 id="welcomeMsg">Carregando bancada...</h2>
            <p style="color: #4a6b70; font-size: 14px;">Selecione uma ferramenta validada do Lab:</p>
            
            <nav class="tool-list">
                <a href="#" class="tool-item">Presença (Módulo 0)</a>
                <a href="#" class="tool-item">Fala Livre</a>
                <a href="#" class="tool-item">Treinamento</a>
                <a href="#" class="tool-item">Relatórios Ativos</a>
            </nav>
        </div>
        
        <button id="btnLogout" style="margin-top: 20px; background: none; border: none; color: #ff7a7a; cursor: pointer; font-weight: bold; width: 100%;">Encerrar Sessão</button>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://paulorobertoxavierjunior-create.github.io/elayon-cadastro/js/config.js"></script>
    <script src="js/presenca.js"></script>
</body>
</html>
