<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Elayon Presença</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#eef5f6;
}

.container {
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card {
  background:white;
  border-radius:12px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

h1 {
  margin-top:0;
}

.btn {
  display:block;
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#6ec1c8;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.btn.secondary {
  background:#173b42;
}

.btn.small {
  width:auto;
  display:inline-block;
  padding:8px 14px;
}

.top-bar {
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}

</style>
</head>

<body>

<div class="container">

  <!-- TOPO -->
  <div class="top-bar">
    <button class="btn small secondary" onclick="window.location.href='https://elayon.space'">← Site</button>
    <button class="btn small" id="btnLogout">Sair</button>
  </div>

  <!-- BOAS VINDAS -->
  <div class="card">
    <h1 id="welcomeTitle">Carregando...</h1>
    <p>
      Este é o seu espaço de presença.
      Aqui você inicia, observa e escolhe o próximo passo.
    </p>
  </div>

  <!-- PERFIL -->
  <div class="card">
    <h2>Seu Perfil</h2>
    <p><strong>Nome:</strong> <span id="userName">...</span></p>
    <p><strong>Email:</strong> <span id="userEmail">...</span></p>
    <p><strong>Plano:</strong> <span id="userPlan">...</span></p>
    <p><strong>Status:</strong> <span id="userAccessStatus">...</span></p>
  </div>

  <!-- BANCADA -->
  <div class="card">
    <h2>Bancada de Ferramentas</h2>

    <button class="btn" id="btnToolPresenca">
      Iniciar Presença
    </button>

    <button class="btn" id="btnToolFalaLivre">
      Fala Livre
    </button>

    <button class="btn" id="btnToolTreino">
      Treinamento Vocal
    </button>

    <button class="btn" id="btnToolRelatorio">
      Relatório Lion
    </button>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/painel.js"></script>

</body>
</html>
